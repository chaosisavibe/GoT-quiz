<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>维斯特洛命运试炼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              westeros: {
                ink: "#0a0b0e",
                stone: "#12141a",
                mist: "#1e222b",
                gold: "#d4af37",
                goldbright: "#f0d78c",
                golddeep: "#8a6a1c",
                golddim: "#9a8629",
                blood: "#5c1a20",
                frost: "#9aa8c4",
              },
            },
            fontFamily: {
              display: ["Cinzel", "serif"],
              poster: ["Bodoni Moda", "Didot", "serif"],
              serifcn: ["Noto Serif SC", "Songti SC", "serif"],
              sans: ["Urbanist", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cinzel:opsz,wght@12..24,500;12..24,600&family=Noto+Serif+SC:wght@400;500;600;700&family=Urbanist:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cover-bg: url("https://i.pinimg.com/1200x/59/33/0b/59330b5db51a38322a2548ba5e2ef108.jpg");
        /* 封面标题与答题页点缀：深青铜 / 锻铁感，避免亮黄 */
        --royal-gold-deep: #1a1712;
        --royal-gold-mid: #4a4030;
        --royal-gold-bright: #7a6a4e;
        --royal-gold-shine: #8f8268;
        --parchment-base: #4a3b2e;
        --parchment-mid: #5e4a38;
        --parchment-edge: #3a2e24;
      }

      html {
        min-height: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }
      body {
        min-height: 100dvh;
        max-width: 100vw;
        overflow-x: hidden;
        background-color: #030304;
      }

      .grain::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* 全屏导入封面：清晰底图 + 轻遮罩，留白与孤独感 */
      .intro-cover {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: stretch;
        padding: 0;
        cursor: pointer;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.95s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .intro-cover.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .intro-cover.is-gone {
        visibility: hidden;
      }
      .intro-cover__bg {
        position: absolute;
        inset: 0;
        background-image: var(--cover-bg);
        background-size: contain;
        background-position: center center;
        background-repeat: no-repeat;
        background-color: #030304;
        filter: contrast(1.04) saturate(0.92);
        animation: breathe 20s ease-in-out infinite alternate;
      }
      .intro-cover__scrim {
        position: absolute;
        inset: 0;
        /* 上轻下略重：既不糊死画面，又托住文字 */
        background: linear-gradient(
            185deg,
            rgba(6, 8, 12, 0.42) 0%,
            rgba(6, 8, 12, 0.12) 42%,
            rgba(4, 5, 8, 0.38) 100%
          ),
          radial-gradient(
            ellipse 90% 70% at 50% 18%,
            rgba(0, 0, 0, 0.5) 0%,
            transparent 55%
          );
        pointer-events: none;
      }
      .intro-cover__inner {
        position: relative;
        z-index: 10;
        display: flex;
        min-height: 100%;
        width: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: clamp(4.5rem, 14vh, 7.5rem) clamp(1.25rem, 5vw, 2.5rem)
          clamp(2.5rem, 9vh, 5rem);
        text-align: center;
      }
      .intro-cover__stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 36rem;
      }

      /* 中文标题：单行 · 暗金锻铁感 · 细划痕高光（非厚重纯金） */
      .cover-title-wrap {
        position: relative;
        display: inline-block;
        padding: 0 0.15em;
      }
      .cover-title-wrap::after {
        content: "";
        position: absolute;
        inset: -2px -4px;
        border-radius: 2px;
        background: repeating-linear-gradient(
          -18deg,
          transparent 0 3px,
          rgba(180, 190, 205, 0.06) 3px 4px,
          transparent 4px 7px
        );
        mix-blend-mode: overlay;
        pointer-events: none;
        opacity: 0.45;
        mask-image: linear-gradient(180deg, #000 12%, transparent 90%);
      }
      .cover-title-cn {
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-weight: 700;
        font-size: clamp(1.45rem, 5.8vw, 3.05rem);
        line-height: 1.06;
        letter-spacing: 0.22em;
        white-space: nowrap;
        max-width: 100vw;
        box-sizing: border-box;
        margin: 0;
        padding-bottom: 0.06em;
        /* 深金属青铜，极少高光；冷边晕避免「糖果金」 */
        background: linear-gradient(
          128deg,
          var(--royal-gold-deep) 0%,
          #2a2520 14%,
          #3d3528 30%,
          var(--royal-gold-mid) 44%,
          #5c5040 54%,
          var(--royal-gold-bright) 62%,
          #3a3328 76%,
          #221e18 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: none;
        filter: drop-shadow(0 1px 0 rgba(30, 32, 38, 0.9))
          drop-shadow(0 -1px 1px rgba(0, 0, 0, 0.65))
          drop-shadow(0 0 22px rgba(55, 62, 72, 0.35))
          drop-shadow(0 10px 28px rgba(0, 0, 0, 0.55));
        animation: sheen 12s linear infinite;
      }

      /* 电影海报式英文：纤细、拉长、带极轻纵向拖影 */
      .cover-sub-en {
        font-family: "Bodoni Moda", "Didot", "Times New Roman", serif;
        font-weight: 400;
        font-style: normal;
        font-size: clamp(0.52rem, 1.55vw, 0.78rem);
        line-height: 1.95;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgba(218, 222, 228, 0.78);
        margin: 0;
        margin-top: clamp(3.25rem, 12vh, 6.5rem);
        max-width: 26rem;
        text-shadow: 0 -14px 10px rgba(210, 215, 222, 0.05),
          0 14px 10px rgba(210, 215, 222, 0.05), 0 2px 14px rgba(0, 0, 0, 0.75);
        opacity: 0;
        animation: rise-fade 2s ease 0.6s forwards;
      }

      .cover-hint {
        font-family: "Urbanist", system-ui, sans-serif;
        font-weight: 300;
        font-size: 0.58rem;
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        text-transform: uppercase;
        color: rgba(175, 182, 192, 0.48);
        margin: 0;
        animation: ember 3.5s ease-in-out infinite;
      }

      @media (max-width: 480px) {
        .cover-title-cn {
          letter-spacing: 0.14em;
        }
        .cover-sub-en {
          letter-spacing: 0.28em;
          padding: 0 0.5rem;
        }
      }

      /* 羊皮纸题卡：整体更暗、做旧，与封面「御赐金」色系呼应 */
      .quiz-parchment {
        position: relative;
        color: #e8ddcc;
        border: 3px double rgba(28, 22, 16, 0.92);
        border-radius: 0.2rem 0.35rem 0.25rem 0.3rem;
        box-shadow: 0 0 0 1px rgba(20, 16, 12, 0.55),
          0 18px 48px rgba(0, 0, 0, 0.58),
          inset 0 0 0 1px rgba(200, 170, 110, 0.12),
          inset 0 0 100px rgba(12, 8, 6, 0.35),
          inset 0 0 220px rgba(42, 32, 22, 0.25);
        background: linear-gradient(
            168deg,
            #6a5844 0%,
            var(--parchment-mid) 14%,
            #524232 38%,
            var(--parchment-base) 55%,
            #453628 72%,
            #5a4a3a 88%,
            var(--parchment-edge) 100%
          ),
          radial-gradient(
            90% 70% at 12% 18%,
            rgba(90, 72, 52, 0.45),
            transparent 58%
          ),
          radial-gradient(
            70% 55% at 88% 85%,
            rgba(20, 14, 10, 0.5),
            transparent 52%
          );
        clip-path: polygon(
          0% 1.2%,
          2.5% 0%,
          97.5% 0%,
          100% 1.5%,
          100% 98.5%,
          97.8% 100%,
          2.2% 100%,
          0% 98.8%
        );
      }
      .quiz-parchment::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        border-radius: inherit;
        opacity: 0.2;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      .quiz-parchment::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        border-radius: inherit;
        opacity: 0.35;
        mix-blend-mode: soft-light;
        background: radial-gradient(
            ellipse 120% 40% at 50% 0%,
            rgba(212, 175, 90, 0.07),
            transparent 55%
          ),
          radial-gradient(
            circle at 22% 78%,
            rgba(0, 0, 0, 0.18),
            transparent 45%
          ),
          radial-gradient(
            circle at 80% 30%,
            rgba(0, 0, 0, 0.12),
            transparent 40%
          );
      }
      .quiz-brand-line {
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-weight: 700;
        letter-spacing: 0.32em;
      }
      .quiz-parchment > * {
        position: relative;
        z-index: 1;
      }
      .quiz-parchment .parchment-muted {
        color: rgba(200, 188, 168, 0.72);
      }
      .quiz-parchment .parchment-accent {
        color: #9a8a6c;
        text-shadow: 0 0 18px rgba(70, 78, 88, 0.25);
      }
      .parchment-option {
        position: relative;
        overflow: hidden;
        border-radius: 1rem;
        border: 1px solid rgba(24, 18, 12, 0.55);
        background: rgba(8, 6, 4, 0.22);
        color: #efe6d8;
        box-shadow: inset 0 1px 0 rgba(212, 175, 90, 0.08),
          inset 0 -1px 0 rgba(0, 0, 0, 0.35);
      }
      .parchment-option::after {
        content: "";
        position: absolute;
        top: 0;
        left: -75%;
        width: 60%;
        height: 100%;
        background: linear-gradient(
          110deg,
          transparent 0%,
          rgba(212, 175, 90, 0.05) 45%,
          rgba(212, 175, 90, 0.10) 50%,
          rgba(212, 175, 90, 0.05) 55%,
          transparent 100%
        );
        transform: skewX(-18deg);
        pointer-events: none;
        transition: left 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .parchment-option:hover::after {
        left: 125%;
      }
      .parchment-option:hover {
        background: rgba(212, 175, 90, 0.1);
        border-color: rgba(200, 170, 100, 0.35);
      }
      .parchment-track {
        background: rgba(8, 6, 4, 0.45);
      }
      #progress-bar {
        position: relative;
      }
      #progress-bar::after {
        content: "";
        position: absolute;
        right: 0;
        top: -1px;
        width: 8px;
        height: calc(100% + 2px);
        background: radial-gradient(ellipse, rgba(212, 175, 90, 0.5) 0%, transparent 70%);
        border-radius: 4px;
        pointer-events: none;
        animation: fate-glow 2.8s ease-in-out infinite;
      }
      .quiz-parchment .parchment-body {
        color: rgba(238, 230, 214, 0.96);
      }

      /* ═══════════════════════════════════════════
         结果页：沉浸式角色揭晓场景
         全屏海报 · 完整角色图 · 底部文字叠加
         ═══════════════════════════════════════════ */

      #result-section {
        transition: opacity 1.2s ease;
        background: #000;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      #result-section.off {
        opacity: 0 !important;
        pointer-events: none !important;
        overflow: hidden;
      }
      #result-section:not(.off) {
        opacity: 1 !important;
      }

      /* 固定背景层：角色海报始终铺满视口 */
      .result-stage {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: visible;
        pointer-events: none;
        background: #0a0a0c;
        opacity: 0;
        transition: opacity 1.2s ease;
      }
      #result-section:not(.off) .result-stage {
        opacity: 1;
      }

      /* 自然流内容层：叠加在固定背景之上，撑开滚动 */
      .result-content {
        position: relative;
        z-index: 1;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .result-body {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 100dvh;
      }
      .detail-area {
        position: relative;
        z-index: 1;
        padding-bottom: 2rem;
      }

      /* Hero bg — 全图展示，不裁切 */
      .result-hero {
        background-size: contain;
        background-position: center center;
        background-repeat: no-repeat;
      }
      .result-hero--desktop {
        position: absolute;
        inset: 0;
        background-color: #0a0a0c;
        opacity: 0;
        transform: scale(1.08);
      }
      #result-section:not(.off) .result-hero--desktop {
        animation: portrait-reveal 2.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards,
                   ken-burns 18s ease-in-out 4s infinite alternate;
      }

      .result-hero--mobile {
        display: none;
      }

      /* 遮罩：底部渐暗，角色与文字自然过渡 */
      .result-scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          transparent 0%,
          transparent 25%,
          rgba(0, 0, 0, 0.12) 40%,
          rgba(0, 0, 0, 0.45) 60%,
          rgba(0, 0, 0, 0.80) 85%,
          rgba(0, 0, 0, 0.92) 100%
        );
        pointer-events: none;
        opacity: 0;
        transition: opacity 2s ease 0.3s;
      }
      #result-section:not(.off) .result-scrim {
        opacity: 1;
      }

      /* 文字叠加 — 浮入动效 */
      .result-copy {
        position: relative;
        padding: 1.5rem clamp(1.25rem, 4vw, 2.5rem) 2.5rem;
      }
      /* 氛围层：若隐若现的黑雾玻璃，边缘消散，无硬边框 */
      .result-copy::before {
        content: "";
        position: absolute;
        inset: -16px;
        z-index: -1;
        pointer-events: none;
        background: radial-gradient(
          ellipse 92% 94% at 50% 60%,
          rgba(0, 0, 0, 0.78) 0%,
          rgba(0, 0, 0, 0.28) 45%,
          transparent 100%
        );
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        mask-image: radial-gradient(
          ellipse 92% 94% at 50% 60%,
          black 25%,
          transparent 100%
        );
        -webkit-mask-image: radial-gradient(
          ellipse 92% 94% at 50% 60%,
          black 25%,
          transparent 100%
        );
      }
      .result-copy > * {
        opacity: 0;
        transform: translateY(14px);
        transition: opacity 0.9s ease, transform 0.9s ease;
      }
      #result-section:not(.off) .result-copy > *:nth-child(1) { transition-delay: 1.0s; }
      #result-section:not(.off) .result-copy > *:nth-child(2) { transition-delay: 1.4s; }
      #result-section:not(.off) .result-copy > *:nth-child(3) { transition-delay: 1.8s; }
      #result-section:not(.off) .result-copy > *:nth-child(4) { transition-delay: 2.2s; }
      #result-section:not(.off) .result-copy > *:nth-child(5) { transition-delay: 2.2s; }

      #result-section:not(.off) .result-copy > * {
        opacity: 1;
        transform: translateY(0);
      }

      .glass-panel {
        background: rgba(14, 16, 22, 0.42);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .glass-option {
        background: rgba(255, 255, 255, 0.045);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      #result-narrative p {
        margin-bottom: 1.2em;
      }
      #result-narrative p:last-child {
        margin-bottom: 0;
      }

      .fade-soft {
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      .fade-soft.is-hidden {
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
      }
      .fade-soft.is-visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .section-fade {
        transition: opacity 0.55s ease;
      }
      .section-fade.off {
        opacity: 0;
      }

      .main-shell {
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition: opacity 0.75s ease 0.1s, transform 0.75s ease 0.1s;
      }
      .main-shell.is-active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .detail-reveal {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition: max-height 0.6s ease, opacity 0.45s ease;
      }
      .detail-reveal.open {
        max-height: 56rem;
        opacity: 1;
      }

      /* ═══════════════════════════════════════════
         动效层：冷峻 · 压迫 · 史诗 · 暗黑
         ═══════════════════════════════════════════ */

      /* 1. 封面镜头呼吸推进 */
      @keyframes breathe {
        0%   { transform: scale(1); }
        100% { transform: scale(1.06); }
      }

      /* 2. 标题缓慢浮现 */
      @keyframes rise-fade {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* 3. 暗金烛火呼吸光 */
      @keyframes ember {
        0%, 100% { opacity: 0.4; text-shadow: 0 0 2px rgba(212, 175, 90, 0.06); }
        50%      { opacity: 0.8; text-shadow: 0 0 8px rgba(212, 175, 90, 0.12), 0 0 24px rgba(212, 175, 90, 0.04); }
      }

      /* 4. 金属光泽扫过（标题暗金锻纹） */
      @keyframes sheen {
        0%   { background-position: 200% center; }
        100% { background-position: -200% center; }
      }

      /* 5. 命运线尾端光晕 */
      @keyframes fate-glow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 3px rgba(212, 175, 90, 0.15)); }
        50%      { opacity: 1;   filter: drop-shadow(0 0 8px rgba(212, 175, 90, 0.30)) drop-shadow(0 0 20px rgba(212, 175, 90, 0.08)); }
      }

      /* 6. 结果页揭晓：角色海报渐显 + 镜头回正 */
      @keyframes portrait-reveal {
        0%   { opacity: 0; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }

      /* 7. Ken Burns 极慢推镜 */
      @keyframes ken-burns {
        0%   { transform: scale(1); }
        100% { transform: scale(1.04); }
      }

      /* 8. 文字层从下方浮入 */
      @keyframes text-rise {
        0%   { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* ═══════════════════════════════════════════
         阵营视觉系统
         ═══════════════════════════════════════════ */

      /* 阵营变量 — 通过 data-faction 切换 */
      #result-section[data-faction="lannister"] {
        --fa: #d4af37;
        --fa-dim: rgba(212,175,55,0.25);
        --fa-glow: 0 0 40px rgba(212,175,55,0.08);
        --fa-scrim: linear-gradient(180deg, transparent 0%, rgba(10,8,6,0.35) 35%, rgba(8,5,3,0.85) 70%, #050302 100%);
        --fa-bg: rgba(20,16,12,0.3);
        --fa-border: rgba(212,175,55,0.18);
        --fa-text: #d4af37;
        --fa-particle: rgba(212,175,55,0.35);
        --fa-particle-type: ember;
      }
      #result-section[data-faction="north"] {
        --fa: #8fa8c8;
        --fa-dim: rgba(143,168,200,0.2);
        --fa-glow: 0 0 40px rgba(143,168,200,0.06);
        --fa-scrim: linear-gradient(180deg, transparent 0%, rgba(6,8,12,0.4) 35%, rgba(4,6,10,0.85) 70%, #020308 100%);
        --fa-bg: rgba(10,14,22,0.3);
        --fa-border: rgba(143,168,200,0.15);
        --fa-text: #8fa8c8;
        --fa-particle: rgba(210,225,240,0.3);
        --fa-particle-type: flake;
      }
      #result-section[data-faction="idealist"] {
        --fa: #c04030;
        --fa-dim: rgba(192,64,48,0.3);
        --fa-glow: 0 0 50px rgba(192,64,48,0.1);
        --fa-scrim: linear-gradient(180deg, transparent 0%, rgba(15,6,6,0.4) 35%, rgba(10,4,4,0.9) 70%, #060202 100%);
        --fa-bg: rgba(24,10,10,0.3);
        --fa-border: rgba(192,64,48,0.2);
        --fa-text: #c04030;
        --fa-particle: rgba(220,120,80,0.35);
        --fa-particle-type: ash;
      }
      #result-section[data-faction="chaos"] {
        --fa: #5a7a4a;
        --fa-dim: rgba(90,122,74,0.2);
        --fa-glow: 0 0 30px rgba(90,122,74,0.06);
        --fa-scrim: linear-gradient(180deg, transparent 0%, rgba(8,10,6,0.4) 35%, rgba(5,6,3,0.9) 70%, #020301 100%);
        --fa-bg: rgba(12,16,10,0.3);
        --fa-border: rgba(90,122,74,0.15);
        --fa-text: #5a7a4a;
        --fa-particle: rgba(90,122,74,0.3);
        --fa-particle-type: dust;
      }
      #result-section[data-faction="fringe"] {
        --fa: #7a7a8a;
        --fa-dim: rgba(122,122,138,0.2);
        --fa-glow: 0 0 30px rgba(122,122,138,0.05);
        --fa-scrim: linear-gradient(180deg, transparent 0%, rgba(8,8,10,0.4) 35%, rgba(5,5,7,0.9) 70%, #020203 100%);
        --fa-bg: rgba(12,12,16,0.3);
        --fa-border: rgba(122,122,138,0.12);
        --fa-text: #7a7a8a;
        --fa-particle: rgba(160,160,170,0.25);
        --fa-particle-type: dust;
      }

      /* 阵营 scrim 覆盖 */
      #result-section:not(.off) .result-scrim {
        background: var(--fa-scrim, linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.45) 60%, rgba(0,0,0,0.92) 100%));
      }

      /* 阵营粒子容器 */
      #particle-container {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        overflow: hidden;
        opacity: 0;
        transition: opacity 2s ease 1s;
      }
      #result-section:not(.off) #particle-container {
        opacity: 1;
      }
      .particle {
        position: absolute;
        top: -8px;
        border-radius: 50%;
        background: var(--fa-particle, rgba(200,200,200,0.2));
        will-change: transform, opacity;
      }
      /* 粒子类型：飘落 (flake) */
      @keyframes particle-fall {
        0%   { transform: translateY(-5vh) translateX(0) scale(1); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 0.6; }
        100% { transform: translateY(105vh) translateX(30px) scale(0.6); opacity: 0; }
      }
      /* 粒子类型：上升 (ember/ash) */
      @keyframes particle-rise {
        0%   { transform: translateY(105vh) translateX(0) scale(0.5); opacity: 0; }
        15%  { opacity: 0.8; }
        50%  { opacity: 0.6; }
        85%  { opacity: 0.3; }
        100% { transform: translateY(-5vh) translateX(-20px) scale(0.2); opacity: 0; }
      }
      /* 粒子类型：漂浮 (dust) */
      @keyframes particle-drift {
        0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
        20%  { opacity: 0.5; }
        80%  { opacity: 0.3; }
        100% { transform: translateY(-60vh) translateX(40px) scale(0.3); opacity: 0; }
      }
      .particle {
        animation: particle-fall 10s linear infinite;
      }
      #result-section[data-faction="idealist"] .particle,
      #result-section[data-faction="lannister"] .particle {
        animation-name: particle-rise;
      }
      #result-section[data-faction="chaos"] .particle,
      #result-section[data-faction="fringe"] .particle {
        animation-name: particle-drift;
      }

      /* ═══════════════════════════════════════════
         档案信息：黑暗里浮现 · 阵营色强调
         无完整卡片 · 层级分明 · 边缘消散
         ═══════════════════════════════════════════ */
      .archive-panel {
        margin-top: 0.75rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.45rem;
      }
      /* 阵营标识行 */
      .archive-faction-line {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .archive-emblem {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.6rem;
        height: 1.6rem;
        border-radius: 50%;
        background: var(--fa-dim, rgba(255,255,255,0.06));
        box-shadow: 0 0 24px var(--fa-dim, transparent);
        color: var(--fa-text, #ccc);
        font-size: 0.68rem;
        flex-shrink: 0;
      }
      .archive-faction-name {
        font-family: "Noto Serif SC", serif;
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        color: var(--fa-text, #ccc);
      }
      /* 阵营色分隔线 */
      .archive-divider {
        width: 2.8rem;
        height: 1px;
        background: var(--fa-border, rgba(212,175,55,0.15));
        margin: 0.05rem 0 0.25rem 0;
        flex-shrink: 0;
      }
      /* 信息网格：类似 cinematic HUD 排版 */
      .archive-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.2rem 0.8rem;
        align-items: baseline;
      }
      .archive-stat-label {
        font-family: "Urbanist", "Noto Serif SC", sans-serif;
        font-size: 0.55rem;
        font-weight: 400;
        letter-spacing: 0.14em;
        color: rgba(180, 185, 195, 0.32);
        white-space: nowrap;
        text-transform: uppercase;
      }
      .archive-stat-value {
        font-family: "Noto Serif SC", serif;
        font-size: 0.65rem;
        font-weight: 400;
        letter-spacing: 0.06em;
        color: rgba(210, 215, 225, 0.7);
      }
      .archive-stat-value.accent {
        color: var(--fa-text, #d4af37);
      }
      .archive-stat-value.mainstream { color: rgba(180,190,200,0.6); }
      .archive-stat-value.uncommon { color: rgba(160,180,210,0.7); }
      .archive-stat-value.rare { color: var(--fa-text, #d4af37); }
      .archive-stat-value.extremelyRare { color: rgba(200,180,160,0.75); }

      /* 移动端紧凑：确保按钮首屏可见，不破坏氛围 */
      @media (max-width: 480px) {
        .result-copy {
          padding: 1rem 1rem 1.5rem;
        }
        .archive-panel {
          margin-top: 0.4rem;
        }
        .result-body .toggle-btn-wrap {
          padding-top: 0.75rem;
        }
      }
    </style>
  </head>

    <div

    <script src="data.js"></script>
    <script>
      (function () {
        var DATA = window.WESTEROS_QUIZ;
        if (!DATA) return;

        var dims = DATA.dimensions;
        var questions = DATA.questions;
        var characters = DATA.characters;

        var idx = 0;
        var totals = {};
        dims.forEach(function (d) {
          totals[d] = 0;
        });

        var introCover = document.getElementById("intro-cover");
        var mainShell = document.getElementById("main-shell");
        var quizSection = document.getElementById("quiz-section");
        var resultSection = document.getElementById("result-section");
        var panel = document.getElementById("question-panel");
        var qTheme = document.getElementById("q-theme");
        var qScenario = document.getElementById("q-scenario");
        var qOptions = document.getElementById("q-options");
        var progressLabel = document.getElementById("progress-label");
        var progressBar = document.getElementById("progress-bar");
        var resultDetail = document.getElementById("result-detail");
        var toggleDetailBtn = document.getElementById("toggle-detail-btn");
        var resultHeroDesktop = document.getElementById("result-hero-desktop");
        var resultHeroMobile = document.getElementById("result-hero-mobile");

        var coverDismissed = false;

        function enterQuizFromCover() {
          if (coverDismissed) return;
          coverDismissed = true;
          introCover.setAttribute("aria-hidden", "true");
          introCover.classList.add("is-leaving");

          var coverFinished = false;
          function finishCover() {
            if (coverFinished) return;
            coverFinished = true;
            introCover.classList.add("is-gone");
            introCover.style.display = "none";
            mainShell.classList.add("is-active");
          }

          introCover.addEventListener(
            "transitionend",
            function onCoverFade(e) {
              if (e.propertyName !== "opacity") return;
              introCover.removeEventListener("transitionend", onCoverFade);
              finishCover();
            }
          );
          window.setTimeout(finishCover, 1100);
        }

        introCover.addEventListener("click", enterQuizFromCover);
        introCover.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            enterQuizFromCover();
          }
        });

        var charRanges = {};
        dims.forEach(function (dname) {
          var minV = Infinity;
          var maxV = -Infinity;
          characters.forEach(function (c) {
            var v = c.scores[dname] || 0;
            if (v < minV) minV = v;
            if (v > maxV) maxV = v;
          });
          charRanges[dname] = Math.max(16, maxV - minV);
        });

        function distance(a, b) {
          var sum = 0;
          for (var i = 0; i < dims.length; i++) {
            var dname = dims[i];
            var diff =
              ((a[dname] || 0) - (b.scores[dname] || 0)) / charRanges[dname];
            sum += diff * diff;
          }
          return Math.sqrt(sum);
        }

        function bestMatch(user) {
          var best = characters[0];
          var bestD = distance(user, best);
          for (var i = 1; i < characters.length; i++) {
            var dist = distance(user, characters[i]);
            if (dist < bestD) {
              bestD = dist;
              best = characters[i];
            }
          }
          return best;
        }

        function portraitUrl(c) {
          var u = (c.portrait || c.image || "").trim();
          return u;
        }

        var resultStage = document.getElementById("result-stage");

        function applyResultPortraits(url) {
          if (!url) {
            resultHeroDesktop.style.backgroundImage = "none";
            resultHeroMobile.style.backgroundImage = "none";
            return;
          }
          var v = 'url("' + url.replace(/"/g, '\\"') + '")';
          resultHeroDesktop.style.backgroundImage = v;
          resultHeroMobile.style.backgroundImage = v;
        }

        function setProgress() {
          var n = idx + 1;
          progressLabel.textContent = "第 " + n + " / " + questions.length + " 题";
          var pct = ((idx + 1) / questions.length) * 100;
          progressBar.style.width = pct + "%";
        }

        function fillQuestion() {
          var q = questions[idx];
          qTheme.textContent = q.theme;
          qScenario.textContent = q.scenario;
          qOptions.innerHTML = "";
          setProgress();

          qOptions.className = "mt-10 flex flex-col gap-3.5";

          q.options.forEach(function (opt) {
            var btn = document.createElement("button");
            btn.type = "button";
            var baseCls =
              "option-hit parchment-option w-full transition focus:outline-none focus-visible:ring-2 focus-visible:ring-stone-500/50";
            btn.className =
              baseCls +
              " px-5 py-4 text-left text-[0.92rem] font-normal leading-relaxed tracking-wide";
            btn.innerHTML =
              '<span class="font-display parchment-accent mr-2.5">' +
              opt.key +
              ".</span>" +
              opt.text;
            btn.addEventListener("click", function () {
              dims.forEach(function (dname) {
                totals[dname] += opt.scores[dname] || 0;
              });
              if (idx < questions.length - 1) {
                idx++;
                renderQuestion(true);
              } else {
                showResult();
              }
            });
            qOptions.appendChild(btn);
          });
        }

        function renderQuestion(useFade) {
          if (!useFade) {
            fillQuestion();
            panel.classList.remove("is-hidden");
            panel.classList.add("is-visible");
            return;
          }
          panel.classList.remove("is-visible");
          panel.classList.add("is-hidden");
          window.setTimeout(function () {
            fillQuestion();
            panel.classList.remove("is-hidden");
            panel.classList.add("is-visible");
          }, 420);
        }

        function showResult() {
          var match = bestMatch(totals);
          resultDetail.classList.remove("open");
          toggleDetailBtn.textContent = "展开卷书纪传";

          quizSection.classList.add("off");
          window.setTimeout(function () {
            quizSection.classList.add("hidden");
            resultSection.classList.remove("off");
            resultSection.classList.remove("pointer-events-none");
          }, 420);

          document.getElementById("result-name").textContent = match.name;
          document.getElementById("result-house").textContent = match.house;
          document.getElementById("result-slogan-poster").textContent =
            match.slogan;
          document.getElementById("result-narrative").innerHTML =
            match.narrative || match.highlight || "";

          applyResultPortraits(portraitUrl(match));

          // 阵营与稀有度
          resultSection.dataset.faction = match.faction;
          resultSection.dataset.rarity = match.rarity;

          // 粒子
          var pc = document.getElementById("particle-container");
          if (pc) {
            pc.innerHTML = "";
            createParticles(pc);
          }

          // 档案面板
          var archive = document.getElementById("result-archive");
          if (archive) {
            var faction = DATA.factions[match.faction];
            var rarityMap = { mainstream:"主流人格", uncommon:"少见人格", rare:"稀有人格", extremelyRare:"极稀有人格" };
            var altChar = findCharById(match.altMatch);
            archive.innerHTML =
              '<div class="archive-faction-line">' +
                '<span class="archive-emblem">' + faction.badge + '</span>' +
                '<span class="archive-faction-name">' + faction.fullName + '</span>' +
              '</div>' +
              '<div class="archive-divider"></div>' +
              '<div class="archive-grid">' +
                '<span class="archive-stat-label">倾向</span>' +
                '<span class="archive-stat-value accent">' + faction.tendency + '</span>' +
                '<span class="archive-stat-label">类型</span>' +
                '<span class="archive-stat-value ' + match.rarity + '">' + (rarityMap[match.rarity] || match.rarity) + '</span>' +
                '<span class="archive-stat-label">占比</span>' +
                '<span class="archive-stat-value">' + match.rarityPct + '</span>' +
                '<span class="archive-stat-label">相近</span>' +
                '<span class="archive-stat-value">' + (altChar ? altChar.name : '—') + '</span>' +
              '</div>';
          }

          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function findCharById(id) {
          for (var i = 0; i < characters.length; i++) {
            if (characters[i].id === id) return characters[i];
          }
          return null;
        }

        function createParticles(container) {
          var count = 25;
          for (var i = 0; i < count; i++) {
            var p = document.createElement("span");
            p.className = "particle";
            var size = 1.5 + Math.random() * 4;
            p.style.width = size + "px";
            p.style.height = size + "px";
            p.style.left = Math.random() * 100 + "%";
            p.style.animationDuration = (6 + Math.random() * 14) + "s";
            p.style.animationDelay = (Math.random() * 12) + "s";
            container.appendChild(p);
          }
        }

        toggleDetailBtn.addEventListener("click", function () {
          var open = resultDetail.classList.toggle("open");
          toggleDetailBtn.textContent = open ? "收起卷书纪传" : "展开卷书纪传";
          if (open) {
            window.setTimeout(function () {
              resultSection.scrollTo({ top: resultSection.scrollHeight, behavior: "smooth" });
            }, 100);
          }
        });

        document.getElementById("restart-btn").addEventListener("click", function () {
          idx = 0;
          dims.forEach(function (dname) {
            totals[dname] = 0;
          });
          resultSection.classList.add("off", "pointer-events-none");
          window.setTimeout(function () {
            quizSection.classList.remove("hidden");
            quizSection.classList.add("off");
            void quizSection.offsetWidth;
            quizSection.classList.remove("off");
            resultDetail.classList.remove("open");
            toggleDetailBtn.textContent = "展开卷书纪传";
            applyResultPortraits("");
            resultSection.dataset.faction = "";
            resultSection.dataset.rarity = "";
            var pc = document.getElementById("particle-container");
            if (pc) pc.innerHTML = "";
            renderQuestion(false);
            window.scrollTo({ top: 0, behavior: "smooth" });
          }, 480);
        });

        renderQuestion(false);

        window.runSimulation = function (n) {
          n = n || 1000;
          var counts = {};
          characters.forEach(function (c) { counts[c.id] = 0; });
          for (var t = 0; t < n; t++) {
            var sim = {};
            dims.forEach(function (d) { sim[d] = 0; });
            questions.forEach(function (q) {
              var pick = Math.floor(Math.random() * q.options.length);
              var opt = q.options[pick];
              dims.forEach(function (d) {
                sim[d] += opt.scores[d] || 0;
              });
            });
            var match = bestMatch(sim);
            counts[match.id]++;
          }
          var sorted = characters.slice().sort(function (a, b) { return counts[b.id] - counts[a.id]; });
          console.log("===== " + n + " 次随机模拟 =====");
          console.log("角色\t\t次数\t占比");
          sorted.forEach(function (c) {
            var p = (counts[c.id] / n * 100).toFixed(1) + "%";
            console.log((c.name + "\t\t").slice(0, 8) + "\t" + counts[c.id] + "/" + n + "\t" + p);
          });
          return counts;
        };
        window.runReachability = function () {
          console.log("===== 最优路径可达性 =====");
          var ok = 0;
          characters.forEach(function (target) {
            var user = {};
            dims.forEach(function (d) { user[d] = 0; });
            questions.forEach(function (q) {
              var bestOpt = null, bestDist = Infinity;
              q.options.forEach(function (opt) {
                var test = {};
                dims.forEach(function (d) { test[d] = user[d] + (opt.scores[d] || 0); });
                var d = distance(test, target);
                if (d < bestDist) { bestDist = d; bestOpt = opt; }
              });
              dims.forEach(function (d) { user[d] += (bestOpt.scores[d] || 0); });
            });
            var match = bestMatch(user);
            console.log(target.id + " \t→ " + match.id + (match.id === target.id ? " ✓" : " ✗"));
            if (match.id === target.id) ok++;
          });
          console.log("可达: " + ok + "/" + characters.length);
        };
      })();
    </script>
